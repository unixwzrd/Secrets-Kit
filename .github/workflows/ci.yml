name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PIP_NO_CACHE_DIR: "1"

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-15
            python-version: "3.12"
          - os: macos-26
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -e ".[dev]"
      - name: Run validation
        run: |
          export PYTHON="$(command -v python)"
          make lint PYTHON="$PYTHON"
          make test-fast PYTHON="$PYTHON"
          make test-sqlite-unit PYTHON="$PYTHON"
