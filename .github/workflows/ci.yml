name: ci

# Full Python matrix on macOS: every push/PR runs tests on 3.9–3.13 (see matrix below).
# Release tag workflow also runs validate + per-Python wheels; wheel smoke uses the same
# interpreter as each matrix leg (not a single “golden” Python).

on:
  push:
    branches:
      - main
    tags-ignore:
      - "v*"

  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_NO_CACHE_DIR: "1"

jobs:

  tests:

    strategy:
      fail-fast: false

      matrix:
        os:
          - macos-15
          - ubuntu-latest

        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Run local validation
        run: |
          export PYTHON="$(command -v python)"
          bash ./scripts/run_local_validation.sh
