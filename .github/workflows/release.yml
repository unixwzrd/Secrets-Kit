name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PIP_NO_CACHE_DIR: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Release preflight (tag vs pyproject)
        run: bash ./scripts/release_preflight.sh
      - name: Install for tests
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -e ".[dev]"
      - name: Validate
        run: |
          export PYTHON="$(command -v python)"
          make lint PYTHON="$PYTHON"
          make test-fast PYTHON="$PYTHON"
          make test-sqlite-unit PYTHON="$PYTHON"

  wheel:
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build universal wheel
        run: |
          python -m pip install -U pip setuptools wheel build
          python -m build -w -n
          test "$(find dist -maxdepth 1 -name 'seckit-*-py3-none-any.whl' | wc -l | tr -d ' ')" = "1"
      - name: Smoke test wheel install
        run: |
          rm -rf .wheel-smoke
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install -U pip
          .wheel-smoke/bin/pip install dist/*.whl
          .wheel-smoke/bin/seckit --version
          .wheel-smoke/bin/seckit info --json | python -m json.tool > /dev/null
          .wheel-smoke/bin/seckit doctor --install-check | python -m json.tool > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*-py3-none-any.whl

  sdist:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          # --no-isolation requires setuptools in the active env (same as wheel job).
          python -m pip install -U pip setuptools wheel build
          python -m build -s -n
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  collect-dist:
    needs: [wheel, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: List dist
        run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: seckit-dist
          path: dist/*

  publish-github-release:
    needs: [collect-dist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: seckit-dist
          path: dist
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
