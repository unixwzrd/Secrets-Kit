name: release

on:
  release:
    types:
      - published
      - edited

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: true

env:
  PIP_NO_CACHE_DIR: "1"

jobs:

  validate:

    strategy:
      fail-fast: false

      matrix:
        os:
          - macos-15
          - ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Release preflight
        run: bash ./scripts/release_preflight.sh

      - name: Install
        run: |
          python -m pip install -U pip setuptools wheel build
          python -m pip install -e ".[dev]"

      - name: Validate
        run: |
          export PYTHON="$(command -v python)"
          bash ./scripts/run_local_validation.sh --without-localhost-transport

  wheel:

    needs: validate

    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install -U pip setuptools wheel build
          python -m build -w -n

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  smoke:

    needs: wheel

    strategy:
      fail-fast: false

      matrix:
        os:
          - macos-15
          - ubuntu-latest

        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist

      - name: Smoke test wheel
        run: |
          python -m venv .wheel-smoke

          .wheel-smoke/bin/python -m pip install -U pip

          .wheel-smoke/bin/pip install dist/*.whl

          .wheel-smoke/bin/seckit --version
          .wheel-smoke/bin/seckit info --json | python -m json.tool > /dev/null
          .wheel-smoke/bin/seckit doctor --install-check | python -m json.tool > /dev/null

  sdist:

    needs: validate

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install -U pip setuptools wheel build
          python -m build -s -n

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
